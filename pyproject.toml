[project]
name = "pm-bot"
version = "0.1.0"
description = "Polymarket V3 phase-1 validation bot foundation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116,<0.117",
  "httpx>=0.28,<0.29",
  "jinja2>=3.1,<3.2",
  "pydantic>=2.11,<2.12",
  "pydantic-settings>=2.9,<2.10",
  "typer>=0.16,<0.17",
  "uvicorn>=0.35,<0.36",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<1.18",
  "pytest>=8.4,<8.5",
  "pytest-cov>=6.2,<6.3",
  "ruff>=0.12,<0.13",
]

[build-system]
requires = ["hatchling>=1.27,<1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pm_bot"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "N",
  "UP",
  "B",
  "C4",
  "SIM",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unused_configs = true
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
